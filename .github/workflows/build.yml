name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar e empacotar (todas as versões da ABNT)
        uses: xu-cheng/texlive-action@v2
        with:
          scheme: full
          run: |
            apk add --no-cache make zip python3
            make check
            make dist

      - uses: actions/upload-artifact@v4
        with:
          name: modelos-abntex2-ufv
          path: dist/

      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
